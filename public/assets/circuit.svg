<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Circuit board ground for the Projects page.

       Drawn on a 40px pitch and tiled at a multiple of it, so the cards
       laid out on the same pitch always land on the board rather than
       across it. Every trace turns on a pad, and every diagonal is 45
       degrees, because those are the two rules real board layout follows
       and breaking them is what makes drawn circuitry look wrong.

       Deliberately sparse: this sits behind text, so it reads as ground
       rather than pattern.

       Painted solid black on purpose. The stylesheet uses this as a
       mask rather than an image, so only the alpha matters and the
       colour comes from CSS — currentColor would not have worked, since
       an SVG referenced from background-image or mask-image has no
       parent to inherit a colour from. -->
  <g fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- horizontal runs -->
    <path d="M0 40 H60 L80 20 H140 L160 40 H240" />
    <path d="M0 120 H40 L60 140 H100" />
    <path d="M140 200 H180 L200 180 H240" />

    <!-- vertical runs -->
    <path d="M40 0 V20 L60 40 V80 L40 100 V240" />
    <path d="M200 0 V60 L180 80 V140 L200 160 V240" />
    <path d="M120 80 V160" />

    <!-- short stubs, the bits that go off to something not drawn -->
    <path d="M100 140 L120 160" />
    <path d="M160 40 L160 60 L140 80" />
    <path d="M60 180 H100 L120 160" />
  </g>

  <!-- pads: a ring with a drilled centre, at the junctions the traces meet -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <circle cx="40" cy="40" r="5" />
    <circle cx="40" cy="120" r="5" />
    <circle cx="120" cy="80" r="5" />
    <circle cx="120" cy="160" r="5" />
    <circle cx="200" cy="80" r="5" />
    <circle cx="200" cy="160" r="5" />
    <circle cx="160" cy="40" r="4" />
    <circle cx="60" cy="180" r="4" />
  </g>
  <g fill="#000">
    <circle cx="40" cy="40" r="1.6" />
    <circle cx="40" cy="120" r="1.6" />
    <circle cx="120" cy="80" r="1.6" />
    <circle cx="120" cy="160" r="1.6" />
    <circle cx="200" cy="80" r="1.6" />
    <circle cx="200" cy="160" r="1.6" />
  </g>

  <!-- surface-mount pads, the small rectangles a component would sit on -->
  <g fill="#000" opacity="0.55">
    <rect x="76" y="16" width="9" height="8" rx="1.5" />
    <rect x="135" y="16" width="9" height="8" rx="1.5" />
    <rect x="196" y="196" width="8" height="9" rx="1.5" />
    <rect x="36" y="196" width="8" height="9" rx="1.5" />
  </g>
</svg>
